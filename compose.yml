version: "3.8"

services:
  app:
    image: harireddy143/flm-oct:javaapp
    container_name: app_cont
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=vprofile
      - DB_USER=admin
      - DB_PASS=admin123
    depends_on:
      - db
    networks:
      - appnet
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  db:
    image: harireddy143/flm-oct:db
    container_name: db_cont
    environment:
      - MYSQL_ROOT_PASSWORD=admin123
      - MYSQL_DATABASE=vprofile
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  appnet:
    driver: overlay

volumes:
  dbdata:
